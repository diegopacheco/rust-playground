    <rect x="74"  y="46"  width="34" height="34" fill="#7ad7e0"/>
    <rect x="108" y="46"  width="34" height="34" fill="#7ad7e0"/>
    <rect x="142" y="46"  width="34" height="34" fill="#7ad7e0"/>
