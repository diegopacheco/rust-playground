<svg xmlns="http://www.w3.org/2000/svg" width="380" height="100" viewBox="0 0 380 100" role="img" aria-label="sqlite-manager">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2118"/>
      <stop offset="100%" stop-color="#12100f"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0803c"/>
      <stop offset="60%" stop-color="#ce422b"/>
      <stop offset="100%" stop-color="#a33116"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cbcf5"/>
      <stop offset="100%" stop-color="#0f80cc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ce422b"/>
      <stop offset="100%" stop-color="#0f80cc"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="80" height="80" rx="19" fill="url(#plate)"/>

  <g transform="translate(50 50) scale(0.5)">
    <g fill="url(#gear)">
      <rect x="-8" y="-73" width="16" height="22" rx="4"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(45)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(90)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(135)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(180)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(225)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(270)"/>
      <rect x="-8" y="-73" width="16" height="22" rx="4" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#gear)" stroke-width="13"/>

    <g transform="translate(0 -2)">
      <ellipse cx="0" cy="-20" rx="30" ry="10" fill="url(#disc)"/>
      <path d="M-30 -20 v20 a30 10 0 0 0 60 0 v-20 a30 10 0 0 1 -60 0 z" fill="#1391dd"/>
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="url(#disc)"/>
      <path d="M-30 0 v20 a30 10 0 0 0 60 0 v-20 a30 10 0 0 1 -60 0 z" fill="#0d6ba9"/>
      <ellipse cx="0" cy="20" rx="30" ry="10" fill="#0d6ba9"/>
      <path d="M-13 5 l11 9 -11 9" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <rect x="3" y="21" width="14" height="4.5" rx="2.25" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>

  <text x="108" y="47" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#12100f">sqlite</text>
  <text x="108" y="75" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="300" fill="#ce422b">manager</text>
  <rect x="109" y="82" width="150" height="3" rx="1.5" fill="url(#rule)"/>
</svg>
